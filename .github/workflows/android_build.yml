name: Android Build Pipeline

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

jobs:
  build_android:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: native/anivault_torrent/go.mod
          cache: true
          cache-dependency-path: native/anivault_torrent/go.sum

      - name: Cache Pub Dependencies
        uses: actions/cache@v4
        with:
          path: ~/.pub-cache
          key: ${{ runner.os }}-pub-${{ hashFiles('pubspec.lock') }}
          restore-keys: |
            ${{ runner.os }}-pub-

      - name: Clean Flutter tool state
        run: rm -rf .dart_tool .flutter-plugins-dependencies

      - name: Fetch dependencies
        run: |
          flutter pub get || {
            rm -f .dart_tool/package_graph.json
            flutter pub get
          }

      - name: Prepare Gradle wrapper
        run: chmod +x android/gradlew

      - name: Analyze
        run: flutter analyze

      - name: Cache anivault_anitomy Linux build
        uses: actions/cache@v4
        with:
          path: native/anivault_anitomy/build_linux
          key: ${{ runner.os }}-anitomy-linux-${{ hashFiles('native/anivault_anitomy/**/*') }}
          restore-keys: |
            ${{ runner.os }}-anitomy-linux-

      - name: Compile anivault_anitomy for Linux (for Unit Tests)
        run: |
          cmake -S native/anivault_anitomy -B native/anivault_anitomy/build_linux \
            -DCMAKE_CXX_COMPILER=clang++ \
            -DCMAKE_BUILD_TYPE=Release
          cmake --build native/anivault_anitomy/build_linux --config Release

      - name: Test
        run: |
          export LD_LIBRARY_PATH=$LD_LIBRARY_PATH:$(pwd)/native/anivault_anitomy/build_linux
          flutter test

      - name: Build native torrent engine for Android
        run: |
          chmod +x native/anivault_torrent/build_android.sh
          native/anivault_torrent/build_android.sh

      - name: Build release APK
        run: flutter build apk --release

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: anivault-android-apk
          path: build/app/outputs/flutter-apk/app-release.apk
