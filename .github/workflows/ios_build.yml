name: iOS Build Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build_ios:
    name: Build iOS IPA
    runs-on: macos-15
    permissions:
      contents: write
      
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Cache Pub Dependencies
        uses: actions/cache@v4
        with:
          path: ~/.pub-cache
          key: ${{ runner.os }}-pub-${{ hashFiles('pubspec.lock') }}
          restore-keys: |
            ${{ runner.os }}-pub-

      - name: Clean Flutter tool state
        run: rm -rf .dart_tool .flutter-plugins-dependencies
          
      - name: Fetch dependencies
        run: |
          flutter pub get || {
            rm -f .dart_tool/package_graph.json
            flutter pub get
          }
        
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios

      - name: Cache Rust Build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: native/anivault_core -> target
          key: ios-aarch64
          
      - name: Build anivault_core for iOS (Compile from source)
        env:
          ORT_STRATEGY: compile
        run: |
          cd native/anivault_core
          cargo build --target aarch64-apple-ios --release
          cd ../..

      - name: Select Xcode 16
        run: sudo xcode-select -s /Applications/Xcode_16.app/Contents/Developer

      - name: Build anivault_anitomy for iOS (Compile from source)
        run: |
          cmake -S native/anivault_anitomy -B native/anivault_anitomy/build_ios \
            -DCMAKE_SYSTEM_NAME=iOS \
            -DCMAKE_OSX_SYSROOT=iphoneos \
            -DCMAKE_OSX_ARCHITECTURES=arm64 \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=16.0 \
            -DCMAKE_BUILD_TYPE=Release
          cmake --build native/anivault_anitomy/build_ios --config Release


      - name: Cache CocoaPods
        uses: actions/cache@v4
        with:
          path: |
            ios/Pods
            ~/Library/Caches/CocoaPods
          key: ${{ runner.os }}-pods-${{ hashFiles('pubspec.lock', 'ios/Podfile', 'ios/Podfile.lock', 'ios/Runner.xcodeproj/project.pbxproj') }}
          restore-keys: |
            ${{ runner.os }}-pods-

      - name: Setup CocoaPods
        run: |
          cd ios
          pod install

      - name: Xcode Cache
        uses: irgaly/xcode-cache@v1
        with:
          key: xcode-cache-deriveddata-${{ github.workflow }}-${{ github.sha }}
          restore-keys: |
            xcode-cache-deriveddata-${{ github.workflow }}-
          restore-mtime-targets: |
            ios/**/*
            native/anivault_core/**/*
            native/anivault_anitomy/**/*
          
      - name: Build iOS Application (No Sign)
        run: |
          flutter build ios --release --no-codesign > flutter_build.log 2>&1 || true
          cd ios
          xcodebuild -workspace Runner.xcworkspace -scheme Runner -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" OTHER_LDFLAGS="-force_load $(pwd)/../native/anivault_core/target/aarch64-apple-ios/release/libanivault_core.a -force_load $(pwd)/../native/anivault_anitomy/build_ios/libanivault_anitomy.a -framework CoreML" > ../xcodebuild.log 2>&1 || true
          cd ..
          if [ ! -d "build/ios/iphoneos/Runner.app" ]; then
            echo "Build failed!"
            exit 1
          fi
          
      - name: Push logs on failure
        if: failure()
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add *.log
          git commit -m "chore: upload build logs [skip ci]" || true
          git push || true
        
      - name: Generate IPA archive
        run: |
          mkdir -p build/ios/iphoneos/Payload
          cp -r build/ios/iphoneos/Runner.app build/ios/iphoneos/Payload
          cd build/ios/iphoneos
          zip -qq -r -9 AniVault.ipa Payload
          
      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: anivault-ios-release
          path: build/ios/iphoneos/AniVault.ipa
